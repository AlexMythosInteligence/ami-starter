<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>AMI</title>

  <meta
    name="theme-color"
    content="#07192b"
  >

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    href="AMI_Icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="AMI_Icon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07192b;
      font-family: Arial, sans-serif;
      color: white;
    }

    .starter {
      width: min(86vw, 420px);
      text-align: center;
    }

    .logo {
      width: min(70vw, 300px);
      border-radius: 22%;
      display: block;
      margin: 0 auto 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 30px;
      opacity: 0.8;
    }

    .start-button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      background: #d7a536;
      color: #07192b;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="starter">

    <img
      class="logo"
      src="AMI_Icon.png"
      alt="AlexMythosIntelligence"
    >

    <h1>AMI</h1>

    <p>AlexMythosIntelligence</p>

    <a
      class="start-button"
      href="https://script.google.com/macros/s/AKfycbzl8K1QRobfv1VPiL994STTnRH4k4EP1ogP16uCSPP5eSETRiYyzhil4GRhzw94UcKJ/exec"
    >
      AMI öffnen
    </a>
  </main>

</body>

</html>
